<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
    <style>
        body { background: #05080f; color: #fff; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: #0b101b; border: 1px solid #1c2536; padding: 40px; border-radius: 16px; }
        input { display: block; width: 100%; padding: 10px; margin: 10px 0; background: #03060c; border: 1px solid #1c2536; color: #fff; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: rgba(0,255,163,0.1); color: #00ffa3; border: 1px solid #00ffa3; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box" id="login-box">
        <h2>Login Test</h2>
        <input type="email" id="email" value="operations@vanguard.com">
        <input type="password" id="password" value="vanguard2026">
        <button onclick="testLogin()">Test Login</button>
    </div>
    <div class="box" id="success-box" style="display:none;">
        <h2>✅ Login Works!</h2>
        <p>The JavaScript is functioning correctly.</p>
    </div>

    <script>
        function testLogin() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            
            if (email === "operations@vanguard.com" && password === "vanguard2026") {
                document.getElementById("login-box").style.display = "none";
                document.getElementById("success-box").style.display = "block";
            } else {
                alert("Wrong credentials");
            }
        }
    </script>
</body>
</html>
