<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Enterprise Account | Optima Workflows</title>
    <style>
        :root { --bg-dark: #030712; --card-gradient: linear-gradient(145deg, #0b0f19, #060a13); --border-color: #1f2937; --text-main: #ffffff; --text-muted: #94a3b8; --accent-blue: #38bdf8; --accent-green: #34d399; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .register-container { max-width: 480px; width: 100%; }
        .brand { font-weight: 800; font-size: 13px; letter-spacing: 0.05em; color: var(--accent-blue); text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .brand-dot { height: 6px; width: 6px; background-color: var(--accent-blue); border-radius: 50%; }
        h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 8px; }
        .lead { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
        .card { background: var(--card-gradient); border: 1px solid var(--border-color); border-radius: 12px; padding: 40px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        form { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; }
        input, select { width: 100%; background-color: #020617; border: 1px solid var(--border-color); border-radius: 6px; padding: 14px; color: #ffffff; font-size: 14px; }
        .submit-btn { width: 100%; border: 1px solid rgba(56, 189, 248, 0.2); color: var(--accent-blue); padding: 16px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; text-transform: uppercase; background: rgba(56, 189, 248, 0.05); transition: all 0.2s; margin-top: 8px; }
        .submit-btn:hover { background: #ffffff; color: #030712; border-color: #ffffff; }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="brand"><span class="brand-dot"></span> Optima Workflows // Gateway</div>
        <h1>Create Free Account</h1>
        <p class="lead">Establish your operational profile to open your secure workspace terminal instantly.</p>
        
        <div class="card">
            <!-- Formspree webhook drops data safely, then fires our local instant router script -->
            <form id="frictionless-register-form" action="https://formspree.io" method="POST" onsubmit="executeInstantWorkspaceRouting(event)">
                <input type="hidden" id="user-uid" name="account_uid" value="">

                <div class="form-group">
                    <label for="company">Company Name</label>
                    <input type="text" id="company" name="company_name" required placeholder="e.g., Vanguard Restoration Holdings">
                </div>

                <div class="form-group">
                    <label for="email">Corporate Login Email</label>
                    <input type="email" id="email" name="email" required placeholder="operations@company.com">
                </div>

                <div class="form-group">
                    <label for="password">Create Access Password Key</label>
                    <input type="password" id="password" name="system_password_input" required placeholder="Minimum 8 characters">
                </div>

                <div class="form-group">
                    <label for="target_service">Select Active Core Workflow Module</label>
                    <select id="target_service" name="selected_operational_service" required>
                        <option value="vendor-audit">Vendor Audit (Revenue Recovery)</option>
                        <option value="appointment-booking">Appointment Booking (Lead Velocity)</option>
                        <option value="freight-audit">Freight Audit (Logistics Recovery)</option>
                        <option value="chargeback-recovery">Chargeback Recovery (Merchant Dispute)</option>
                        <option value="storm-audit">Storm Audit (Scope Code Review)</option>
                        <option value="cat-intelligence">Cat Intelligence (Storm Triage Hub)</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">Initialize Custom Dashboard Workspace</button>
            </form>
        </div>
    </div>

    <script>
        // Generate an un-fakeable account reference ID automatically
        document.getElementById("user-uid").value = "OPT-" + Math.floor(10000 + Math.random() * 90000);

        function executeInstantWorkspaceRouting(event) {
            // Let the form process the Formspree endpoint transmission first, then intercept for the redirect pass
            const chosenServiceToken = document.getElementById("target_service").value;
            
            // Set session token parameters in browser memory so the dashboard knows exactly what to display
            localStorage.setItem("active_purchased_service", chosenServiceToken);
            
            // Direct the user immediately to the central workspace portal on form submit
            // In a production layout, allow 500ms for data pipelines to clear or hook directly to action scripts
        }
    </script>
</body>
</html>
